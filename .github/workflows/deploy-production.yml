name: deploy-production

# Deploys changed service(s) to the production ECS service whenever code is
# merged to main. Uses a path filter to deploy only the service(s) that changed.

on:
  push:
    branches: [main]
    paths:
      - "services/catalog/**"
      - "services/cart/**"

permissions:
  id-token: write
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      catalog: ${{ steps.filter.outputs.catalog }}
      cart: ${{ steps.filter.outputs.cart }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            catalog:
              - 'services/catalog/**'
            cart:
              - 'services/cart/**'

  deploy-catalog:
    needs: detect
    if: needs.detect.outputs.catalog == 'true'
    uses: ./.github/workflows/deploy-service.yml
    with:
      service: catalog
      ecr-repository: shopmesh-catalog
      ecs-service: catalog-service
      image-tag: ${{ github.sha }}
    secrets:
      aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}
      aws-region: ${{ secrets.AWS_REGION }}

  deploy-cart:
    needs: detect
    if: needs.detect.outputs.cart == 'true'
    uses: ./.github/workflows/deploy-service.yml
    with:
      service: cart
      ecr-repository: shopmesh-cart
      ecs-service: cart-service
      image-tag: ${{ github.sha }}
    secrets:
      aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}
      aws-region: ${{ secrets.AWS_REGION }}